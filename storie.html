<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storie — Girolamo Pinto</title>
    <meta name="description" content="Racconti e storie scritte da Girolamo Pinto.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #111114;
            --bg-card: #16161a;
            --bg-elevated: #1c1c21;
            --text-primary: #f0ece4;
            --text-secondary: #9a958c;
            --text-muted: #5c584f;
            --accent: #d4a843;
            --accent-dim: #b8922e;
            --accent-glow: rgba(212, 168, 67, 0.15);
            --border: #2a2a30;
            --border-light: #3a3a42;
            --font-display: 'DM Serif Display', Georgia, serif;
            --font-body: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-literary: 'Lora', Georgia, serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-dim) var(--bg-primary);
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 12, 0.85);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-back {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        .nav-back:hover { color: var(--accent); }

        .nav-back svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hero {
            padding: 10rem 2.5rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.5;
        }

        .hero-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .hero h1 em { font-style: italic; color: var(--accent); }

        .hero-desc {
            font-family: var(--font-literary);
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 560px;
            margin: 0 auto;
            font-weight: 400;
            font-style: italic;
            line-height: 1.8;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 4rem auto;
        }

        .stories-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2.5rem 6rem;
        }

        .story-card {
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 2.5rem;
            margin-bottom: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        .story-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .story-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 3px;
            height: calc(100% + 2px);
            background: var(--accent);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.4s ease;
        }

        .story-card:hover {
            border-color: var(--border-light);
            transform: translateX(8px);
        }

        .story-card:hover::before { transform: scaleY(1); }

        .story-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .story-date {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .story-tag {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 0.15rem 0.5rem;
            letter-spacing: 0.5px;
        }

        .story-reading {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .story-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .story-excerpt {
            font-family: var(--font-literary);
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.8;
            font-weight: 400;
        }

        .story-read-more {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent);
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: gap 0.3s;
        }

        .story-card:hover .story-read-more { gap: 0.8rem; }

        .story-read-more svg {
            width: 12px;
            height: 12px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .loading-msg {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 3rem;
            letter-spacing: 1px;
        }

        .error-msg {
            text-align: center;
            padding: 4rem 2rem;
            border: 1px dashed var(--border);
        }

        .error-msg p {
            font-family: var(--font-literary);
            font-style: italic;
            color: var(--text-muted);
            font-size: 1rem;
        }

        footer {
            padding: 2.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            nav { padding: 1rem 1.5rem; }
            .hero { padding: 8rem 1.5rem 3rem; }
            .stories-section { padding: 0 1.5rem 4rem; }
            .story-card { padding: 1.5rem; }
            .story-title { font-size: 1.3rem; }
            footer { flex-direction: column; gap: 0.75rem; text-align: center; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">GP_</a>
        <a href="index.html" class="nav-back">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Portfolio
        </a>
    </nav>

    <div class="hero">
        <div class="hero-label">Racconti & Storie</div>
        <h1>Le cose che <em>scrivo</em></h1>
        <p class="hero-desc">Storie che nascono di notte, tra un commit e l'altro. Fantascienza, personaggi impossibili e mondi che non esistono ancora.</p>
    </div>

    <div class="divider"></div>

    <div class="stories-section" id="storiesContainer">
        <div class="loading-msg" id="loadingMsg">Caricamento storie...</div>
    </div>

    <footer>
        <span>&copy; 2026 Girolamo Pinto</span>
        <a href="index.html">Torna al portfolio</a>
    </footer>

    <script>
        var arrowSvg = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

        function countWords(html) {
            var temp = document.createElement('div');
            temp.innerHTML = html;
            var body = temp.querySelector('.story-body');
            if (!body) return 0;
            var text = body.textContent || '';
            return text.split(/\s+/).filter(function(w) { return w.length > 0; }).length;
        }

        function calcReadingTime(wordCount) {
            var minutes = Math.ceil(wordCount / 200);
            if (minutes < 1) minutes = 1;
            return minutes + ' min di lettura';
        }

        function buildCard(story, index) {
            var card = document.createElement('a');
            card.href = 'storie/' + story.file;
            card.className = 'story-card';
            card.style.transitionDelay = (index * 0.12) + 's';

            var lettura = story.lettura || '';

            card.innerHTML =
                '<div class="story-meta">' +
                    '<span class="story-date">' + story.data + '</span>' +
                    '<span class="story-tag">' + story.tag + '</span>' +
                    '<span class="story-reading" id="reading-' + index + '">' + lettura + '</span>' +
                '</div>' +
                '<h2 class="story-title">' + story.titolo + '</h2>' +
                '<p class="story-excerpt">' + story.estratto + '</p>' +
                '<div class="story-read-more">Leggi ' + arrowSvg + '</div>';

            return card;
        }

        function loadStories() {
            var container = document.getElementById('storiesContainer');
            var loading = document.getElementById('loadingMsg');

            fetch('storie/racconti.json')
                .then(function(response) {
                    if (!response.ok) throw new Error('File non trovato');
                    return response.json();
                })
                .then(function(stories) {
                    loading.remove();

                    if (stories.length === 0) {
                        container.innerHTML = '<div class="error-msg"><p>Nessuna storia ancora. Torna presto.</p></div>';
                        return;
                    }

                    stories.forEach(function(story, i) {
                        var card = buildCard(story, i);
                        container.appendChild(card);

                        fetch('storie/' + story.file)
                            .then(function(r) { return r.text(); })
                            .then(function(html) {
                                var words = countWords(html);
                                var time = calcReadingTime(words);
                                var el = document.getElementById('reading-' + i);
                                if (el) el.textContent = time;
                            })
                            .catch(function() {});
                    });

                    setTimeout(function() {
                        var cards = document.querySelectorAll('.story-card');
                        cards.forEach(function(card, i) {
                            setTimeout(function() {
                                card.classList.add('visible');
                            }, i * 120);
                        });
                    }, 50);
                })
                .catch(function() {
                    loading.remove();
                    container.innerHTML = '<div class="error-msg"><p>Impossibile caricare le storie. Riprova più tardi.</p></div>';
                });
        }

        loadStories();

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) { e.preventDefault(); return; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return; }
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); return; }
        });
    </script>
</body>
</html>
